name: Validate site content and assets

on:
  push:
    branches:
      - main
      - site-v2
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "assets/*.webp"
      - "assets/*.avif"
      - "css/core/global.css"
      - "css/core/navbar.css"
      - "js/core/preferences.js"
      - "CNAME"
      - "_headers"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

  pull_request:
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "assets/*.webp"
      - "assets/*.avif"
      - "css/core/global.css"
      - "css/core/navbar.css"
      - "js/core/preferences.js"
      - "CNAME"
      - "_headers"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate content, SEO and optimized assets
        run: python .github/scripts/validate-content.py
