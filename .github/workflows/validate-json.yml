name: Validate site content and assets

on:
  push:
    branches:
      - main
      - site-v2
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "404.html"
      - "assets/*.webp"
      - "assets/*.avif"
      - "css/**/*.css"
      - "js/core/preferences.js"
      - "js/core/loader.js"
      - "js/pages/home/home.js"
      - "CNAME"
      - "_headers"
      - ".github/scripts/build-css.py"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

  pull_request:
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "404.html"
      - "assets/*.webp"
      - "assets/*.avif"
      - "css/**/*.css"
      - "js/core/preferences.js"
      - "js/core/loader.js"
      - "js/pages/home/home.js"
      - "CNAME"
      - "_headers"
      - ".github/scripts/build-css.py"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate generated CSS bundles
        run: python .github/scripts/build-css.py --check

      - name: Validate content, SEO and optimized assets
        run: python .github/scripts/validate-content.py

      - name: Check modified JavaScript syntax
        run: |
          node --check js/core/loader.js
          node --check js/pages/home/home.js
