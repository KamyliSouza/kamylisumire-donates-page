name: Validate public site

on:
  push:
    branches:
      - main
      - site-v2
    paths:
      - "data/**/*.json"
      - "data/**/*.md"
      - "**/*.html"
      - "assets/**"
      - "css/**/*.css"
      - "js/**/*.js"
      - "workers.js"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "_headers"
      - "README.md"
      - "AGENTS.md"
      - "DESIGN-SYSTEM.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

  pull_request:
    paths:
      - "data/**/*.json"
      - "data/**/*.md"
      - "**/*.html"
      - "assets/**"
      - "css/**/*.css"
      - "js/**/*.js"
      - "workers.js"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "_headers"
      - "README.md"
      - "AGENTS.md"
      - "DESIGN-SYSTEM.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate content, architecture, SEO and references
        run: python .github/scripts/validate-content.py

      - name: Check all JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check workers.js

      - name: Reject generated Python cache
        run: |
          if find . -type d -name '__pycache__' -o -type f \( -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then
            echo "Python cache/bytecode must not be versioned."
            exit 1
          fi
