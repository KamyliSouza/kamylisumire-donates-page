name: Validate V42 site content and interface

on:
  push:
    branches:
      - main
      - site-v2
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "404.html"
      - "assets/**"
      - "css/**/*.css"
      - "js/**/*.js"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "_headers"
      - "README.md"
      - "AGENTS.md"
      - "DESIGN-SYSTEM.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

  pull_request:
    paths:
      - "data/**/*.json"
      - "index.html"
      - "doacoes/index.html"
      - "404.html"
      - "assets/**"
      - "css/**/*.css"
      - "js/**/*.js"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "_headers"
      - "README.md"
      - "AGENTS.md"
      - "DESIGN-SYSTEM.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/scripts/validate-content.py"
      - ".github/workflows/validate-json.yml"

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate content, SEO, references and assets
        run: python .github/scripts/validate-content.py

      - name: Check all JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
