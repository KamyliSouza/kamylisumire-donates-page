name: Sync games from Trello

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9,21 * * *"

permissions:
  contents: write

concurrency:
  group: editorial-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'KamyliSouza'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync Trello and Steam
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          TRELLO_BOARD_ID: IfgV0jXS
        run: node .github/scripts/sync-jogos.mjs

      - name: Validate generated content
        run: |
          python .github/scripts/validate-content.py
          find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check workers.js
          node --check .github/scripts/sync-jogos.mjs
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("data/content/jogos-artwork.json","utf8")); const hosts=new Set(["shared.fastly.steamstatic.com","shared.akamai.steamstatic.com","cdn.cloudflare.steamstatic.com"]); if(m.version!==1||!Array.isArray(m.games)) throw new Error("jogos-artwork.json inválido"); for(const g of m.games){if(!Number.isSafeInteger(g.steamAppId)||g.steamAppId<=0||!Array.isArray(g.cardCandidates)) throw new Error("Entrada de jogo inválida"); for(const c of g.cardCandidates){const u=new URL(c.url); if(u.protocol!=="https:"||!hosts.has(u.hostname)||u.username||u.password||u.port||/page_bg|page_background|storepagebackground/i.test(u.pathname)) throw new Error("URL de arte não permitida no manifesto");}}'

      - name: Commit only when content changed
        run: |
          if [ -z "$(git status --porcelain -- data/content/jogos.json data/content/jogos-artwork-cache.json data/content/jogos-artwork.json)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content/jogos.json data/content/jogos-artwork-cache.json data/content/jogos-artwork.json
          git commit -m "chore: sync jogos from Trello"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
