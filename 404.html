<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Página não encontrada · Kamyli Sumire</title>
    <meta name="description" content="A página solicitada não foi encontrada.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#B35EAF">

    <script>
        (() => {
            const isGitHubProjectPage =
                window.location.hostname === "kamylisouza.github.io";

            const root = isGitHubProjectPage
                ? "/kamylisumire-donates-page/"
                : "/";

            const base = document.createElement("base");
            base.href = root;
            document.head.appendChild(base);
        })();
    </script>

    <link rel="icon" type="image/webp" href="assets/favicon.webp">
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <script>
        (() => {
            const root = document.documentElement;
            const THEME_KEY = "kamyli:ui-theme";
            const BLUR_KEY = "kamyli:ui-blur";
            const LOW_MEMORY_GB = 2;
            const LOW_CPU_THREADS = 2;

            const read = (key) => {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            };

            const media = (query) => {
                try {
                    return window.matchMedia(query).matches;
                } catch {
                    return false;
                }
            };

            const connection =
                navigator.connection ||
                navigator.mozConnection ||
                navigator.webkitConnection ||
                null;

            const supportsBlur = Boolean(
                window.CSS &&
                typeof window.CSS.supports === "function" &&
                (
                    window.CSS.supports("backdrop-filter", "blur(8px)") ||
                    window.CSS.supports("-webkit-backdrop-filter", "blur(8px)")
                )
            );

            const savedTheme = read(THEME_KEY);
            const theme =
                savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : (media("(prefers-color-scheme: dark)") ? "dark" : "light");

            const savedBlur = read(BLUR_KEY);
            const blurPreference =
                savedBlur === "on" || savedBlur === "off"
                    ? savedBlur
                    : "auto";

            let performanceProfile = "normal";
            let performanceReason = "standard";

            if (connection?.saveData) {
                performanceProfile = "reduced";
                performanceReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-cpu";
            }

            let blur = "on";
            let blurReason = "supported";

            if (!supportsBlur) {
                blur = "off";
                blurReason = "unsupported";
            } else if (blurPreference !== "auto") {
                blur = blurPreference;
                blurReason = "manual";
            } else if (media("(prefers-reduced-transparency: reduce)")) {
                blur = "off";
                blurReason = "reduced-transparency";
            } else if (connection?.saveData) {
                blur = "off";
                blurReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                blur = "off";
                blurReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                blur = "off";
                blurReason = "low-cpu";
            }

            root.dataset.theme = theme;
            root.dataset.blur = blur;
            root.dataset.blurMode =
                blurPreference === "auto" ? "auto" : "manual";
            root.dataset.blurPreference = blurPreference;
            root.dataset.blurReason = blurReason;
            root.dataset.performance = performanceProfile;
            root.dataset.performanceReason = performanceReason;
            root.style.colorScheme = theme;

            window.KAMYLI_UI_BOOTSTRAP_STATE = Object.freeze({
                theme,
                blur,
                blurPreference,
                blurReason,
                blurSupported: supportsBlur,
                performance: performanceProfile,
                performanceReason
            });
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- V40: bundle local único -->
    <link rel="stylesheet" href="css/build/404.css">
</head>

<body>
    <header id="site-navbar"></header>

    <main class="not-found">
        <section class="glass-panel not-found-card">
            <span class="eyebrow">Página não encontrada</span>
            <h1>404</h1>
            <h2>Essa página não existe.</h2>

            <p>
                Talvez o link tenha mudado ou você tenha chegado aqui por engano.
            </p>

            <a class="button button-primary" href="">
                Voltar para o início
            </a>
        </section>
    </main>

    <footer
        class="site-footer"
        id="site-footer"
        aria-label="Créditos e informações do site"
    ></footer>

    <script src="js/core/preferences.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/content.js"></script>
    <script src="js/core/navbar.js"></script>
    <script src="js/core/external-links.js"></script>
    <script src="js/core/footer.js"></script>
</body>
</html>
