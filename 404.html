<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada · Kamyli Sumire</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/global.css">
    <link rel="stylesheet" href="css/core/navbar.css">
    <style>
        .not-found { min-height: 75vh; display:grid; place-items:center; padding:32px 20px; }
        .not-found .glass-panel { max-width:620px; text-align:center; padding:42px; }
        .not-found h1 { font-size:clamp(3rem,10vw,6rem); margin:0; color:var(--primary-color); }
        .not-found p { color:var(--subtitle-color); margin:10px 0 24px; }
    </style>
</head>
<body>
    <header id="site-navbar"></header>
    <main class="not-found">
        <section class="glass-panel">
            <h1>404</h1>
            <h2>Essa página não existe.</h2>
            <p>Talvez o link tenha mudado ou você tenha chegado aqui por engano.</p>
            <a class="button button-primary" href="/">Voltar para o início</a>
        </section>
    </main>
    <script src="js/core/config.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/navbar.js"></script>
</body>
</html>
