<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; connect-src 'self' https://api.kamylisumire.com https://delicate-waterfall-52e1-api-donates-kamyli.annakamyli.workers.dev https://assets.kamylisumire.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">

    <link rel="preconnect" href="https://assets.kamylisumire.com">

    <title>Página não encontrada · Kamyli Sumire</title>
    <meta name="description" content="A página solicitada não foi encontrada.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#B35EAF">

    <script>
        (() => {
            const isGitHubProjectPage =
                window.location.hostname === "kamylisouza.github.io";

            const root = isGitHubProjectPage
                ? "/kamylisumire-donates-page/"
                : "/";

            const base = document.createElement("base");
            base.href = root;
            document.head.appendChild(base);
        })();
    </script>

    <link rel="icon" type="image/webp" href="https://assets.kamylisumire.com/favicon.webp">
    <link rel="icon" type="image/png" href="https://assets.kamylisumire.com/favicon.png">

    <script>
        (() => {
            const root = document.documentElement;
            const THEME_KEY = "kamyli:ui-theme";
            const BLUR_KEY = "kamyli:ui-blur";
            const LOW_MEMORY_GB = 2;
            const LOW_CPU_THREADS = 2;

            const read = (key) => {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            };

            const media = (query) => {
                try {
                    return window.matchMedia(query).matches;
                } catch {
                    return false;
                }
            };

            const connection =
                navigator.connection ||
                navigator.mozConnection ||
                navigator.webkitConnection ||
                null;

            const supportsBlur = Boolean(
                window.CSS &&
                typeof window.CSS.supports === "function" &&
                (
                    window.CSS.supports("backdrop-filter", "blur(8px)") ||
                    window.CSS.supports("-webkit-backdrop-filter", "blur(8px)")
                )
            );

            const savedTheme = read(THEME_KEY);
            const themePreference =
                savedTheme === "auto" ||
                savedTheme === "dark" ||
                savedTheme === "light"
                    ? savedTheme
                    : "auto";

            const systemTheme =
                media("(prefers-color-scheme: dark)")
                    ? "dark"
                    : "light";

            const theme =
                themePreference === "auto"
                    ? systemTheme
                    : themePreference;

            const savedBlur = read(BLUR_KEY);
            const blurPreference =
                savedBlur === "on" || savedBlur === "off"
                    ? savedBlur
                    : "auto";

            let performanceProfile = "normal";
            let performanceReason = "standard";

            if (connection?.saveData) {
                performanceProfile = "reduced";
                performanceReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-cpu";
            }

            let blur = "on";
            let blurReason = "supported";

            if (!supportsBlur) {
                blur = "off";
                blurReason = "unsupported";
            } else if (blurPreference !== "auto") {
                blur = blurPreference;
                blurReason = "manual";
            } else if (media("(prefers-reduced-transparency: reduce)")) {
                blur = "off";
                blurReason = "reduced-transparency";
            } else if (connection?.saveData) {
                blur = "off";
                blurReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                blur = "off";
                blurReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                blur = "off";
                blurReason = "low-cpu";
            }

            root.dataset.theme = theme;
            root.dataset.themeMode =
                themePreference === "auto" ? "auto" : "manual";
            root.dataset.themePreference = themePreference;
            root.dataset.blur = blur;
            root.dataset.blurMode =
                blurPreference === "auto" ? "auto" : "manual";
            root.dataset.blurPreference = blurPreference;
            root.dataset.blurReason = blurReason;
            root.dataset.performance = performanceProfile;
            root.dataset.performanceReason = performanceReason;
            root.style.colorScheme = theme;

            window.KAMYLI_UI_BOOTSTRAP_STATE = Object.freeze({
                theme,
                themePreference,
                blur,
                blurPreference,
                blurReason,
                blurSupported: supportsBlur,
                performance: performanceProfile,
                performanceReason
            });

            /*
             * V45.2 — fundo crítico para backdrop-filter.
             *
             * O CSS dos painéis borra a arte de fundo. Se a imagem ainda não
             * estiver disponível quando o loader sai, o navegador recompõe o
             * backdrop depois e isso parece um "blur atrasado".
             *
             * Só antecipamos a imagem quando blur está ligado, o perfil de
             * performance é normal e Save-Data não está ativo.
             */
            if (
                blur === "on" &&
                performanceProfile === "normal" &&
                !connection?.saveData
            ) {
                const isMobile =
                    media("(max-width: 760px)");

                const backdropUrl =
                    isMobile
                        ? "https://assets.kamylisumire.com/fundo-mobile.avif"
                        : "https://assets.kamylisumire.com/fundo.avif";

                const backdropPreload =
                    document.createElement("link");

                backdropPreload.rel = "preload";
                backdropPreload.as = "image";
                backdropPreload.type = "image/avif";
                backdropPreload.href = backdropUrl;
                backdropPreload.fetchPriority = "high";

                window.KAMYLI_BACKDROP_ASSET_URL = backdropUrl;
                window.KAMYLI_BACKDROP_PRELOAD_READY =
                    new Promise(resolve => {
                        backdropPreload.addEventListener(
                            "load",
                            () => resolve("loaded"),
                            { once: true }
                        );
                        backdropPreload.addEventListener(
                            "error",
                            () => resolve("error"),
                            { once: true }
                        );
                    });

                document.head.appendChild(backdropPreload);
            }
        })();
    </script>

    <script>
        window.KAMYLI_LOADER_STARTED_AT = performance.now();
        document.documentElement.classList.add("site-loading-pending");
    </script>

    <link
        rel="preload"
        href="assets/fonts/nunito-variable.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/global.css?v=47.1">
    <link rel="stylesheet" href="css/core/navbar.css?v=47">
    <link rel="stylesheet" href="css/pages/404.css">
</head>

<body>

        class="site-loader"
        id="site-loader"
        role="status"
        aria-live="polite"
        aria-label="Carregando o site"
    >
        <div class="site-loader-inner">
            <span
                class="site-loader-logo"
                aria-hidden="true"
            ></span>
        </div>
    </div>

    <noscript>
        <style>
            .site-loader {
                display: none !important;
            }
        </style>
    </noscript>

    <header id="site-navbar"></header>

    <main class="not-found">
        <section class="glass-panel not-found-card">
            <span class="eyebrow">Página não encontrada</span>
            <h1>404</h1>
            <h2>Essa página não existe.</h2>

            <p>
                Talvez o link tenha mudado ou você tenha chegado aqui por engano.
            </p>

            <a class="button button-primary" data-button-key="notFoundHome" href="">
                <span data-button-icon aria-hidden="true"></span>
                <span data-button-label>Voltar para o início</span>
            </a>
        </section>
    </main>

    <footer
        class="site-footer"
        id="site-footer"
        aria-label="Créditos e informações do site"
    ></footer>

    <script src="js/core/preferences.js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/content.js?v=47.3"></script>
    <script src="js/core/button-icons.js?v=47.2"></script>
    <script src="js/core/buttons.js?v=47"></script>
    <script src="js/core/navbar.js?v=47.4.4"></script>
    <script src="js/core/external-links.js?v=47"></script>
    <script src="js/core/sanitize.js?v=1"></script>
    <script src="js/core/footer.js?v=47.4.2"></script>
    <script>
        window.KAMYLI_PAGE_CONTENT_READY = true;
    </script>
    <script src="js/core/loader.js?v=46.3"></script>
</body>
</html>
