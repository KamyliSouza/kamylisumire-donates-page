    <script>
        (() => {
            const root = document.documentElement;
            const THEME_KEY = "kamyli:ui-theme";
            const BLUR_KEY = "kamyli:ui-blur";
            const LOW_MEMORY_GB = 2;
            const LOW_CPU_THREADS = 2;

            const read = (key) => {
                try {
                    return localStorage.getItem(key);
                } catch {
                    return null;
                }
            };

            const media = (query) => {
                try {
                    return window.matchMedia(query).matches;
                } catch {
                    return false;
                }
            };

            const connection =
                navigator.connection ||
                navigator.mozConnection ||
                navigator.webkitConnection ||
                null;

            const supportsBlur = Boolean(
                window.CSS &&
                typeof window.CSS.supports === "function" &&
                (
                    window.CSS.supports("backdrop-filter", "blur(8px)") ||
                    window.CSS.supports("-webkit-backdrop-filter", "blur(8px)")
                )
            );

            const savedTheme = read(THEME_KEY);
            const themePreference =
                savedTheme === "auto" ||
                savedTheme === "dark" ||
                savedTheme === "light"
                    ? savedTheme
                    : "auto";

            const systemTheme =
                media("(prefers-color-scheme: dark)")
                    ? "dark"
                    : "light";

            const theme =
                themePreference === "auto"
                    ? systemTheme
                    : themePreference;

            const savedBlur = read(BLUR_KEY);
            const blurPreference =
                savedBlur === "on" || savedBlur === "off"
                    ? savedBlur
                    : "auto";

            let performanceProfile = "normal";
            let performanceReason = "standard";

            if (connection?.saveData) {
                performanceProfile = "reduced";
                performanceReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                performanceProfile = "reduced";
                performanceReason = "low-cpu";
            }

            let blur = "on";
            let blurReason = "supported";

            if (!supportsBlur) {
                blur = "off";
                blurReason = "unsupported";
            } else if (blurPreference !== "auto") {
                blur = blurPreference;
                blurReason = "manual";
            } else if (media("(prefers-reduced-transparency: reduce)")) {
                blur = "off";
                blurReason = "reduced-transparency";
            } else if (connection?.saveData) {
                blur = "off";
                blurReason = "save-data";
            } else if (
                typeof navigator.deviceMemory === "number" &&
                navigator.deviceMemory <= LOW_MEMORY_GB
            ) {
                blur = "off";
                blurReason = "low-memory";
            } else if (
                typeof navigator.hardwareConcurrency === "number" &&
                navigator.hardwareConcurrency <= LOW_CPU_THREADS
            ) {
                blur = "off";
                blurReason = "low-cpu";
            }

            root.dataset.theme = theme;
            root.dataset.themeMode =
                themePreference === "auto" ? "auto" : "manual";
            root.dataset.themePreference = themePreference;
            root.dataset.blur = blur;
            root.dataset.blurMode =
                blurPreference === "auto" ? "auto" : "manual";
            root.dataset.blurPreference = blurPreference;
            root.dataset.blurReason = blurReason;
            root.dataset.performance = performanceProfile;
            root.dataset.performanceReason = performanceReason;
            root.style.colorScheme = theme;

            window.KAMYLI_UI_BOOTSTRAP_STATE = Object.freeze({
                theme,
                themePreference,
                blur,
                blurPreference,
                blurReason,
                blurSupported: supportsBlur,
                performance: performanceProfile,
                performanceReason
            });

            /*
             * V45.2 — fundo crítico para backdrop-filter.
             *
             * O CSS dos painéis borra a arte de fundo. Se a imagem ainda não
             * estiver disponível quando o loader sai, o navegador recompõe o
             * backdrop depois e isso parece um "blur atrasado".
             *
             * Só antecipamos a imagem quando blur está ligado, o perfil de
             * performance é normal e Save-Data não está ativo.
             */
            if (
                blur === "on" &&
                performanceProfile === "normal" &&
                !connection?.saveData
            ) {
                const isMobile =
                    media("(max-width: 760px)");

                const backdropUrl =
                    isMobile
                        ? "https://assets.kamylisumire.com/fundo-mobile.avif"
                        : "https://assets.kamylisumire.com/fundo.avif";

                const backdropPreload =
                    document.createElement("link");

                backdropPreload.rel = "preload";
                backdropPreload.as = "image";
                backdropPreload.type = "image/avif";
                backdropPreload.href = backdropUrl;
                backdropPreload.fetchPriority = "high";

                window.KAMYLI_BACKDROP_ASSET_URL = backdropUrl;
                window.KAMYLI_BACKDROP_PRELOAD_READY =
                    new Promise(resolve => {
                        backdropPreload.addEventListener(
                            "load",
                            () => resolve("loaded"),
                            { once: true }
                        );
                        backdropPreload.addEventListener(
                            "error",
                            () => resolve("error"),
                            { once: true }
                        );
                    });

                document.head.appendChild(backdropPreload);
            }
        })();
    </script>

    <script>
        window.KAMYLI_LOADER_STARTED_AT = performance.now();
        document.documentElement.classList.add("site-loading-pending");
    </script>

<body>
    <div
        class="site-loader"
        id="site-loader"
        role="status"
        aria-live="polite"
        aria-label="Carregando o site"

        <div class="site-loader-inner">

    </div>

    </noscript>

    <header id="site-navbar"></header>

    <main class="site-shell blog-shell" id="blogIndexPage">
        <header class="glass-panel blog-intro">
            <span class="eyebrow" id="blogEyebrow">Blog</span>
            <h1 id="blogTitle">Publicações</h1>
            <p id="blogDescription">
                Textos, pensamentos, bastidores e novidades em uma lista simples,
                sem imagens de capa.
            </p>
        </header>

        <section
            class="blog-tools"
            id="blogTools"
            aria-label="Busca e filtros das publicações"
            hidden
        >
            <div class="blog-search-controls">
                <div class="blog-search-field" data-blog-search-field>
                    <span class="blog-search-field-label" id="blogSearchFieldLabel">Buscar em</span>
                    <button
                        class="blog-search-field-toggle"
                        id="blogSearchField"
                        type="button"
                        aria-labelledby="blogSearchFieldLabel blogSearchFieldValue"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-controls="blogSearchFieldMenu"
                    >
                        <span id="blogSearchFieldValue">Todos os campos</span>
                        <span class="blog-search-field-chevron" aria-hidden="true"></span>
                    </button>
                    <div
                        class="blog-search-field-menu"
                        id="blogSearchFieldMenu"
                        role="listbox"
                        aria-labelledby="blogSearchFieldLabel"
                        hidden
                    >
                        <button class="blog-search-field-option" type="button" role="option" aria-selected="true" data-value="todos">Todos os campos</button>
                        <button class="blog-search-field-option" type="button" role="option" aria-selected="false" data-value="titulo">Título</button>
                        <button class="blog-search-field-option" type="button" role="option" aria-selected="false" data-value="resumo">Resumo</button>
                        <button class="blog-search-field-option" type="button" role="option" aria-selected="false" data-value="tags">Tags</button>
                    </div>
                </div>
                <input
                    class="blog-search"
                    id="blogSearch"
                    type="search"
                    placeholder="Buscar publicações..."
                    aria-label="Buscar publicações"
                    autocomplete="off"
                >
            </div>

            <div class="blog-filters" id="blogFilters" aria-label="Filtrar por tag"></div>
        </section>

        <section
            class="glass-panel blog-post-list"
            id="blogPostList"
            aria-live="polite"
            aria-label="Lista de publicações"
        >
            <p class="blog-empty">Carregando publicações...</p>
        </section>
    </main>

    <footer
        class="site-footer"
        id="site-footer"
        aria-label="Créditos e informações do site"
    ></footer>
