<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie a Kamyli Sumire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <!-- Foto de Perfil Redonda -->
        <img src="avatar.webp" alt="Kamyli Sumire" class="profile-img">

        <h1>Apoie a Live! ✨</h1>
        <p class="subtitle">Escolha a opção ideal para você:</p>
        
        <div class="buttons">
            <!-- Botão Nacional (LivePix) com ícone SVG do Brasil -->
            <a href="https://livepix.gg/kamyli" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                <svg class="flag-icon" viewBox="0 0 36 36"><path fill="#009b3a" d="M32 5H4a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h28a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path fill="#fedf00" d="m18 7 14 11-14 11L4 18z"/><circle fill="#002776" cx="18" cy="18" r="7"/><path fill="#fff" d="M11 17h14c0-2.5-2-4-7-4s-7 1.5-7 4z"/></svg>
                Apoiar com PIX (LivePix)
            </a>
            
            <!-- Botão Internacional (Pixie) com ícone SVG de Globo -->
            <a href="https://pixie.gg/kamyli" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Moeda Estrangeira (Pixie)
            </a>
        </div>

        <!-- Caixa de Aviso sobre Pixie vs LivePix -->
        <div class="notice-box">
            <p>💡 <strong>Aviso:</strong> A doação mínima pelo Pixie é de <strong>R$ 6</strong> por conta das taxas da plataforma. Para doações a partir de <strong>R$ 1</strong>, recomendamos usar o LivePix!</p>
        </div>
    </main>

    <!-- Rodapé com os Créditos -->
    <footer class="footer-credits">
        Arte do Fundo por <a href="https://www.instagram.com/h0wl_oficial/" target="_blank">@h0wl_oficial</a> | 
        Avatar por <a href="https://bsky.app/profile/maililac.bsky.social" target="_blank">@maililac</a>
    </footer>
